<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Hello, World! — A little sparkle</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root { color-scheme: dark; --ink: #f5f5ff; --muted: #a6abc7; --pink: #ff85bd; --violet: #a995ff; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; overflow: hidden; color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      background: radial-gradient(ellipse at 18% 20%, #282454 0, transparent 38%),
                  radial-gradient(ellipse at 82% 78%, #183d53 0, transparent 40%), #0b1020;
    }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .2;
      background-image: radial-gradient(#fff 0.7px, transparent .7px); background-size: 28px 28px;
      mask-image: linear-gradient(transparent, black 25%, black 80%, transparent); }
    .orb { position: fixed; width: 340px; aspect-ratio: 1; border-radius: 50%; filter: blur(90px); opacity: .2; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; }
    .orb.one { background: #9d62ff; top: 8%; left: -10%; }
    .orb.two { background: #31d4c4; right: -10%; bottom: 0; animation-delay: -5s; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; position: relative; }
    .card { width: min(100%, 760px); padding: clamp(34px, 7vw, 72px); text-align: center; position: relative;
      border: 1px solid rgba(255,255,255,.13); border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
      box-shadow: 0 32px 100px rgba(0,0,0,.34), inset 0 1px rgba(255,255,255,.12); backdrop-filter: blur(18px);
      animation: appear .9s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; padding: 8px 13px; border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
      color: #d9d7f4; font-size: 12px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; background: rgba(255,255,255,.045); }
    .spark { color: #ffd67a; font-size: 15px; animation: twinkle 2s ease-in-out infinite; }
    h1 { margin: 28px 0 17px; font: 700 clamp(3.1rem, 10vw, 6.6rem)/.98 'Space Grotesk', sans-serif; letter-spacing: -.075em; }
    h1 span { display: block; background: linear-gradient(100deg, #fff 12%, #e2d7ff 49%, #ff9dcc 88%); color: transparent; background-clip: text; }
    .lead { max-width: 440px; margin: 0 auto; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.75; }
    button { margin-top: 34px; display: inline-flex; align-items: center; gap: 11px; border: 0; border-radius: 999px; padding: 15px 22px;
      color: #17132b; background: linear-gradient(105deg, #ffe08a, #ff9fc9 55%, #c1a7ff); font: 700 14px 'DM Sans', sans-serif;
      box-shadow: 0 8px 30px rgba(255,151,194,.2); cursor: pointer; transition: transform .2s, box-shadow .2s; }
    button:hover { transform: translateY(-3px); box-shadow: 0 13px 38px rgba(255,151,194,.32); }
    button:active { transform: translateY(0) scale(.98); }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .footer { margin-top: 42px; color: #737995; font-size: 12px; letter-spacing: .04em; }
    .footer b { color: #b6addf; font-weight: 500; }
    .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 18px); opacity: 0; pointer-events: none;
      border: 1px solid rgba(255,255,255,.15); border-radius: 14px; padding: 12px 18px; color: var(--ink); background: rgba(22,25,48,.9); backdrop-filter: blur(12px); transition: .3s; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    @keyframes appear { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes drift { to { transform: translate(45px, -28px) scale(1.12); } }
    @keyframes twinkle { 50% { transform: rotate(25deg) scale(1.2); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div><div class="orb two" aria-hidden="true"></div>
  <main>
    <section class="card" aria-labelledby="hello-title">
      <div class="eyebrow"><span class="spark" aria-hidden="true">✦</span> A tiny beginning</div>
      <h1 id="hello-title"><span>Hello,</span><span>World!</span></h1>
      <p class="lead">A little page, a little sparkle, and a whole world of possibilities. Here’s to what you make next.</p>
      <button id="hello-button" type="button"><span aria-hidden="true">✧</span> Say hello back</button>
      <div class="footer">Made with <b>curiosity</b> &amp; a touch of magic</div>
    </section>
  </main>
  <div class="toast" id="hello-toast" role="status" aria-live="polite">Hello right back at you! ✨</div>
  <script>
    const button = document.querySelector('#hello-button');
    const toast = document.querySelector('#hello-toast');
    let timer;
    button.addEventListener('click', () => {
      toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(() => toast.classList.remove('show'), 2400);
    });
  </script>
</body>
</html>
